<title>Widget builder has moved</title>
<!--
  RETIRED 2026-08-20.

  This page built its dropdown from directory.json's `properties` list, which is keyed on
  the parent property name. Where a property holds differently-named communities it matches
  no listing at all, so the page offered scopes like "Inicio Tampa (49)" whose own preview
  rendered "0 units available" — it contradicted itself, and it would hand a client a
  permanently blank widget. build.py and w.html were fixed for that in d1e2ee7; this
  consumer was left behind.

  The builder now lives in Beacon (Marketing > Widgets), where it is behind the company
  login, reads the same feed, offers client-portfolio scoping, lead-source stamping, and
  refuses to emit an embed that matches no homes. There is one generator.
-->
