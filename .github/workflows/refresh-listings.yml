name: Refresh Atrium listings

# Re-pulls the AppFolio public feed and commits any changes.
#  - Every run (~30 min): light "grid" refresh — price, availability, new/removed listings.
#  - Every ~2 hours: full refresh (--refresh-details) that also re-fetches each listing's
#    detail page, so edits to description / photos / rental terms show up too.

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, offset off the busy top-of-hour for reliability
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # let the bot push the refreshed data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync AppFolio group membership (PGs + Multifamily)
        # Picks up properties newly onboarded into a PG or into Multifamily. Runs on the
        # 2-hourly full pass only — group membership changes on onboarding, not by the minute.
        # No credentials configured => skips and keeps the last synced groups.json.
        env:
          REPORTS_CLIENT_ID: ${{ secrets.REPORTS_CLIENT_ID }}
          REPORTS_CLIENT_SECRET: ${{ secrets.REPORTS_CLIENT_SECRET }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPFOLIO_DATABASE_NAME: ${{ secrets.APPFOLIO_DATABASE_NAME }}
        run: |
          if [ "$(( 10#$(date -u +%H) % 2 ))" -eq 0 ] && [ "$(( 10#$(date -u +%M) ))" -lt 30 ]; then
            python3 sync_groups.py || echo "group sync failed — keeping the previous groups.json"
          else
            echo "skipping group sync on this pass"
          fi
      - name: Refresh listings
        run: |
          # Full detail refresh once every 2 hours (the :07 run of even UTC hours); light otherwise.
          if [ "$(( 10#$(date -u +%H) % 2 ))" -eq 0 ] && [ "$(( 10#$(date -u +%M) ))" -lt 30 ]; then
            echo "Full refresh (grid + detail pages)"
            python3 build.py --refresh-details
          else
            echo "Light refresh (grid only)"
            python3 build.py
          fi
      - name: Sanity-check the generated data
        run: |
          python3 - <<'PY'
          import json, sys
          import subprocess
          d = json.load(open('listings.json'))
          w = json.load(open('widget-data.json'))
          dr = json.load(open('directory.json'))
          errs = []
          if len(d) < 100: errs.append(f"only {len(d)} listings — feed looks truncated")
          if len(w) != len(d): errs.append(f"widget-data {len(w)} != listings {len(d)}")
          tagged = sum(1 for x in d if x.get('property'))
          if tagged < len(d) * 0.5:
              errs.append(f"property tags collapsed: {tagged}/{len(d)} tagged")
          if len(dr['properties']) < 5:
              errs.append(f"directory has only {len(dr['properties'])} communities")

          # An empty result is indistinguishable from a rate-limited read unless you assert
          # on it, and these failures are all SILENT: the widget renders, it is just wrong.
          #
          # TWO TIERS, and the split matters more than the checks do. A fatal check skips
          # the commit step below, so NOTHING is pushed — and because the baseline is
          # `git show HEAD:directory.json`, HEAD never advances and every later run
          # re-compares against the same frozen snapshot and fails identically. A single
          # legitimate event would freeze listings.meetatrium.com, every client embed,
          # meetatrium.com, orlandorentals.com and Beacon's tour photos on stale rent and
          # availability, forever, with only a red X to show for it. Stale prices in front
          # of a prospect are a worse outcome than the drift these checks watch for.
          #
          #   FATAL   -> only states that cannot arise from normal business: the feed
          #              itself broke, or groups.json is structurally wrong.
          #   WARNING -> anything a leasing week can legitimately produce. ::warning::
          #              annotates the run and shows in the summary; the data still ships.
          warns = []
          try:
              prev = json.loads(subprocess.run(['git','show','HEAD:directory.json'],
                                               capture_output=True, text=True, check=True).stdout)
          except Exception:
              prev = None

          # 1. Client embeds live on someone else's website; nothing else would notice them
          #    going blank. Zero PROPERTIES means groups.json is broken (fatal). Zero
          #    LISTINGS just means fully leased, which is legal and self-heals (warn).
          for g in dr.get('groups', []):
              was = next((x for x in (prev or {}).get('groups', []) if x['key'] == g['key']), None)
              if not g.get('properties'):
                  errs.append(f"client group {g['key']} has no properties — groups.json is broken")
              if g.get('listings', 0) == 0:
                  warns.append(f"client group {g['key']} has 0 listings right now — its embed renders empty")
              elif was and g.get('listings', 0) < was.get('listings', 0) * 0.5:
                  warns.append(f"client group {g['key']} dropped {was['listings']} -> {g['listings']} listings")

          # 2. `ap` must be a real application URL. build.py has a DELIBERATE fallback to the
          #    plain listing page when a unit has no apply link (coming-soon, applications
          #    off, application pending), so a handful of these is normal and must not wedge
          #    the site. A broad collapse means AppFolio changed its markup.
          bad = [x.get('id') for x in w if 'rental_applications/new' not in (x.get('ap') or '')]
          if len(bad) > max(5, len(w) * 0.02):
              errs.append(f"{len(bad)}/{len(w)} rows have a degraded apply URL — AppFolio markup changed?")
          elif bad:
              warns.append(f"{len(bad)}/{len(w)} listings have no online application: {bad[:10]}")
          # source= is added unconditionally by build.py on BOTH branches, so ANY row
          # missing it is a code regression, not a business state. Fatal on sight.
          no_src = sum(1 for x in w if 'source=' not in (x.get('ap') or ''))
          if no_src:
              errs.append(f"{no_src}/{len(w)} apply URLs carry no source= — leads become unattributable")

          # 3. Group membership collapsing takes every PG/MF scope down with it. Warn: a
          #    portfolio genuinely leaving is a real thing that must not freeze the site.
          pg_rows = sum(1 for x in w if x.get('pg'))
          if prev:
              prev_pg = sum(c['count'] for c in prev.get('pgs', []))
              if prev_pg and pg_rows < prev_pg * 0.8:
                  warns.append(f"PG tags dropped: {pg_rows} rows vs {prev_pg} last run")
              if prev.get('mfTotal') and dr.get('mfTotal', 0) < prev['mfTotal'] * 0.8:
                  warns.append(f"Multifamily dropped: {dr.get('mfTotal')} vs {prev['mfTotal']} last run")

          for x in warns:
              print(f"::warning::{x}")
          if errs:
              print("REFRESH FAILED SANITY CHECK:"); [print(" -", e) for e in errs]; sys.exit(1)
          print(f"OK: {len(d)} listings, {tagged} tagged, {len(dr['properties'])} communities, "
                f"{pg_rows} PG-tagged, {len(dr.get('groups', []))} client groups, {len(warns)} warnings")
          PY
      - name: Commit if changed
        run: |
          git config user.name  "atrium-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html grid.html listings.json homes widget-data.json directory.json groups.json
          git diff --cached --quiet || git commit -m "Refresh listings $(date -u +%FT%TZ)"
          git push
